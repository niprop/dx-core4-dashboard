name: Refresh report and deploy dashboard

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      owner:
        description: "GitHub org/user to analyze"
        required: false
        default: "pallets"
      repo:
        description: "Repo name to analyze"
        required: false
        default: "click"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m dx_dashboard.cli \
            --owner "${{ github.event.inputs.owner || 'pallets' }}" \
            --repo "${{ github.event.inputs.repo || 'click' }}" \
            --out data/report.json
      - name: Copy report next to dashboard for Pages
        run: cp data/report.json dashboard/report.json
      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/report.json
          git diff --staged --quiet || git commit -m "chore: refresh report.json [skip ci]"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
